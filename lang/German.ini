error_onlyonce = "Ungültiger Wert für 'only_once'."
error_invalidtargetjson = "Ungültiger Zielfeldtyp. Das Zielfeld muss eine Text Box ohne Validierung oder eine Notes Box sein."
error_invalidtargettext = "Der Zielfeldtyp muss eine Text Box ohne Validierung sein."
error_nomapping = "Speicherfeldzuordnungen müssen angegeben werden."
error_invalidmapping = "Ungültige Speicherfeldzuordnungen."
