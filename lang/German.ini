; Stopwatch EM

; config.json
module_name = "Stoppuhr"
module_desc = "Ein flexibles REDCap External Module, das Stoppuhren in Dateneingabeformularen und Umfragen bereitstellt. Es kann verstrichene Zeit, Erfassungen, Runden sowie Start- und Stoppzeitpunkte in mehreren Formaten speichern. Details und Fehlermeldungen finden Sie auf der <a href=\"https://github.com/grezniczek/stopwatch\" target=\"_blank\">GitHub-Seite</a> des Moduls."
module_docs = "README.md"
ps_enablejs = "JavaScript-Debug-Protokollierung aktivieren"

; action-tags
at_stopwatch = "Verwandelt ein kompatibles Feld in eine Stoppuhr oder schreibt das Ergebnis in ein separat konfiguriertes Zielfeld. Das Widget kann mit einem JSON-Parameterobjekt angepasst werden:<br><code>@STOPWATCH=<br>{<br>&nbsp;&nbsp;&quot;parameter&quot;: &quot;wert&quot;<br>}</code><br>Details und Beispiele finden Sie in der Moduldokumentation."
at_stopwatch_capture = "Fügt eine Stoppuhr hinzu, die mehrere Erfassungen der verstrichenen Zeit speichert. Die Konfiguration erfolgt wie beim Aktionstag <code>@STOPWATCH</code>. Details und Beispiele finden Sie in der Moduldokumentation."
at_stopwatch_lap = "Fügt eine Stoppuhr hinzu, die mehrere Runden speichert. Die Konfiguration erfolgt wie beim Aktionstag <code>@STOPWATCH</code>. Details und Beispiele finden Sie in der Moduldokumentation."

