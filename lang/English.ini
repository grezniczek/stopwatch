; Stopwatch EM

; config.json
module_name = "Stopwatch"
module_desc = "A flexible REDCap External Module that adds stopwatch widgets to data-entry forms and surveys. It can store elapsed time, captures, laps, and start/stop timestamps in several formats. For details and bug reports, see the module's <a href=\"https://github.com/grezniczek/stopwatch\" target=\"_blank\">GitHub page</a>."
module_docs = "README.md"
ps_enablejs = "Enable JavaScript debug logging"

; action-tags
at_stopwatch = "Turns a compatible field into a stopwatch widget, or writes the result to a separately configured target field. Customize the widget with a JSON parameter object:<br><code>@STOPWATCH=<br>{<br>&nbsp;&nbsp;&quot;parameter&quot;: &quot;value&quot;<br>}</code><br>See the module documentation for details and examples."
at_stopwatch_capture = "Adds a stopwatch that records multiple captures of elapsed time. Configure it in the same way as the <code>@STOPWATCH</code> action tag. See the module documentation for details and examples."
at_stopwatch_lap = "Adds a stopwatch that records multiple laps. Configure it in the same way as the <code>@STOPWATCH</code> action tag. See the module documentation for details and examples."

; Stopwatch elements
label_start = "Start"
label_resume = "Resume"
label_stop = "Stop"
label_reset = "Reset"
label_lap = "Lap"
label_capture = "Capture"
label_laptime = "Lap time"
label_cumulated = "Cumulated"
aria_stopwatch = "Stopwatch"

; Error messages (PHP)
error_invalidjson = "Invalid JSON supplied for {0} action tag of field '{1}'."
error_invalidtarget = "Invalid target field or @STOPWATCH and target field are not on the same instrument."
error_invalidmissingtarget = "Invalid or missing target field. Target field must be of type 'Text Box' and either Integer, Number, or Time (MM:SS) validation and be located on the same instrument as {0}."
error_onlyonce = "Invalid value for 'only_once'."
error_invalidtargetjson = "Invalid target field type. Target must be of type 'Text Box' (without validation) or 'Notes Box'."
error_invalidtargettext = "Target field type must be of type 'Text Box' without validation."
error_nomapping = "Storage field mappings must be provided."
error_invalidmapping = "Invalid storage field mappings."
error_invalidmappingkeys = "Invalid storage mapping keys: {0}."
error_invalidmappping = "Invalid field mappings. All fields must exist and be on the same repeating form."
error_invalidevent = "Invalid event."
error_mappingtext = "Mapping field '{0}' must be of type 'Text Box'."
error_mappinginvalidtype = "Mapped field '{0}' has an invalid type."
error_formeventmismatch = "Form '{0}' is not on event '{1}'."

; Error messages (JS)
error_overflow = "Elapsed times > 59:59 cannot be inserted! Resetting to stored value (or blank)."
